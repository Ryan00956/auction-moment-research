name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -e . --no-deps
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify_public_release.py
      - name: Rebuild model smoke artifact
        run: >-
          python -m auction_moment_research.train_world_model
          --input data/v1/core/treasures.csv
          --output "${{ runner.temp }}/world-model-v1.json"
          --manifest "${{ runner.temp }}/world-model-manifest.json"
